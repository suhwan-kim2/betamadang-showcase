<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit Desk</title><style>:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#111a26;color:#edf3f8}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:700px;margin:auto}small{color:#7ed9c2;letter-spacing:2px}h1{font-size:clamp(25px,6vw,40px);margin:12px 0}p{color:#aabccb;line-height:1.65}label{display:block;margin:16px 0 8px}input,select,textarea,button{font:inherit;border-radius:12px;border:1px solid #435264;padding:13px;max-width:100%}input,select,textarea{background:#1b293a;color:inherit;width:100%}button{background:#7ed9c2;color:#102623;cursor:pointer;font-weight:700;margin:8px 6px 8px 0;min-height:46px}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #ffce79;outline-offset:3px}button:disabled{opacity:.6;cursor:default}.box{background:#1b293a;padding:20px;border-radius:18px;margin:18px 0}output{display:block;font-size:24px;color:#7ed9c2;overflow-wrap:anywhere}textarea{min-height:130px}#board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}#board button{margin:0;height:66px;font-size:24px}.history{padding-left:22px;line-height:2}.history li{border-bottom:1px solid #435264}@media(max-width:420px){body{padding:16px}.box{padding:14px}}</style><main><small>BETAMADANG / DAILY LAB</small><h1>Unit Desk</h1><p>Convert length, weight, and temperature. Switch units and compare results without opening another app.</p><label for="group">Measurement</label><select id="group"><option value="length">Length</option><option value="mass">Weight</option><option value="temp">Temperature</option></select><label for="amount">Value</label><input id="amount" type="number" value="1"><label for="from">From</label><select id="from"></select><label for="to">To</label><select id="to"></select><button id="swap">Swap units</button><div class="box"><output id="out" aria-live="polite"></output></div></main><script>const $=id=>document.getElementById(id),units={length:{m:1,cm:.01,km:1000,in:0.0254,ft:.3048},mass:{kg:1,g:.001,lb:.45359237},temp:{'°C':1,'°F':1,K:1}};function calc(){let n=Number($('amount').value),g=$('group').value,a=$('from').value,b=$('to').value;if(!$('amount').value||!Number.isFinite(n)){$('out').textContent='Enter a number.';return}if(g==='temp'){n=a==='°F'?(n-32)*5/9:a==='K'?n-273.15:n;if(n< -273.15){$('out').textContent='Temperature cannot be below absolute zero.';return}n=b==='°F'?n*9/5+32:b==='K'?n+273.15:n}else{n=n*units[g][a]/units[g][b]}$('out').textContent=Number.isFinite(n)?n.toLocaleString('en-US',{maximumFractionDigits:6})+' '+b:'The result is outside the supported range.'}function setup(){for(const id of ['from','to']){$(id).replaceChildren(...Object.keys(units[$('group').value]).map(k=>new Option(k,k)))}$('to').selectedIndex=1;calc()}$('group').onchange=setup;for(const id of ['amount','from','to'])$(id).oninput=calc;$('swap').onclick=()=>{const a=$('from').value;$('from').value=$('to').value;$('to').value=a;calc()};setup();</script></html>

<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory Pairs</title><style>:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#111a26;color:#edf3f8}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:700px;margin:auto}small{color:#7ed9c2;letter-spacing:2px}h1{font-size:clamp(25px,6vw,40px);margin:12px 0}p{color:#aabccb;line-height:1.65}label{display:block;margin:16px 0 8px}input,select,textarea,button{font:inherit;border-radius:12px;border:1px solid #435264;padding:13px;max-width:100%}input,select,textarea{background:#1b293a;color:inherit;width:100%}button{background:#7ed9c2;color:#102623;cursor:pointer;font-weight:700;margin:8px 6px 8px 0;min-height:46px}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #ffce79;outline-offset:3px}button:disabled{opacity:.6;cursor:default}.box{background:#1b293a;padding:20px;border-radius:18px;margin:18px 0}output{display:block;font-size:24px;color:#7ed9c2;overflow-wrap:anywhere}textarea{min-height:130px}#board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}#board button{margin:0;height:66px;font-size:24px}.history{padding-left:22px;line-height:2}.history li{border-bottom:1px solid #435264}@media(max-width:420px){body{padding:16px}.box{padding:14px}}</style><main><small>BETAMADANG / DAILY LAB</small><h1>Memory Pairs</h1><p>Flip two cards and find matching symbols. Clear the board in as few attempts as you can.</p><label for="difficulty">Difficulty</label><select id="difficulty"><option value="6">6 pairs: warm-up</option><option value="8">8 pairs: challenge</option></select><button id="restart">New game</button><p id="status" aria-live="polite"></p><div id="board"></div></main><script>const $=id=>document.getElementById(id),symbols=['☀','☂','★','♫','◆','☕','✿','☾'];let first=null,locked=false,moves=0,found=0,timer;function start(){clearTimeout(timer);first=null;locked=false;moves=found=0;const n=Number($('difficulty').value),cards=[...symbols.slice(0,n),...symbols.slice(0,n)];for(let i=cards.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]]}$('board').replaceChildren(...cards.map((s,i)=>{const b=document.createElement('button');b.textContent='?';b.setAttribute('aria-label',(i+1)+' card');b.onclick=()=>{if(locked||b.disabled||first===b)return;b.textContent=s;if(!first){first=b;return}moves++;if(first.textContent===s){first.disabled=b.disabled=true;first=null;found++;update(n)}else{locked=true;const a=first;timer=setTimeout(()=>{a.textContent=b.textContent='?';first=null;locked=false},750);update(n)}};return b}));update(n)}function update(n){$('status').textContent=found===n?'Complete! Attempts: '+moves+'':'Attempts: '+moves+' · Pairs: '+found+'/'+n}$('restart').onclick=start;$('difficulty').onchange=start;start();</script></html>

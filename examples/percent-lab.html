<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Percent Lab</title><style>:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#111a26;color:#edf3f8}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:700px;margin:auto}small{color:#7ed9c2;letter-spacing:2px}h1{font-size:clamp(25px,6vw,40px);margin:12px 0}p{color:#aabccb;line-height:1.65}label{display:block;margin:16px 0 8px}input,select,textarea,button{font:inherit;border-radius:12px;border:1px solid #435264;padding:13px;max-width:100%}input,select,textarea{background:#1b293a;color:inherit;width:100%}button{background:#7ed9c2;color:#102623;cursor:pointer;font-weight:700;margin:8px 6px 8px 0;min-height:46px}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #ffce79;outline-offset:3px}button:disabled{opacity:.6;cursor:default}.box{background:#1b293a;padding:20px;border-radius:18px;margin:18px 0}output{display:block;font-size:24px;color:#7ed9c2;overflow-wrap:anywhere}textarea{min-height:130px}#board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}#board button{margin:0;height:66px;font-size:24px}.history{padding-left:22px;line-height:2}.history li{border-bottom:1px solid #435264}@media(max-width:420px){body{padding:16px}.box{padding:14px}}</style><main><small>BETAMADANG / DAILY LAB</small><h1>Percent Lab</h1><p>Check a discount, calculate a percentage, or compare two numbers. See the formula alongside the answer.</p><label for="mode">Calculation</label><select id="mode"><option value="discount">Price after discount</option><option value="part">B% of A</option><option value="ratio">A as a percentage of B</option></select><label for="a">A: amount or number</label><input id="a" type="number" value="50000"><label for="b">B: percentage or comparison number</label><input id="b" type="number" value="20"><button id="calc">Calculate</button><div class="box"><output id="out" aria-live="polite"></output><p id="formula"></p></div></main><script>const $=id=>document.getElementById(id);function calc(){const a=Number($('a').value),b=Number($('b').value),m=$('mode').value;let n,f;if(!$('a').value||!$('b').value||!Number.isFinite(a)||!Number.isFinite(b)){n='Enter both numbers.'}else if(m==='discount'&&(a<0||b<0||b>100)){n='Use a non-negative price and a discount from 0 to 100.'}else if(m==='ratio'&&b===0){n='Comparison number B cannot be zero.'}else{n=m==='discount'?a*(1-b/100):m==='part'?a*b/100:a/b*100;f=m==='discount'?a+' × (1 − '+b+' / 100)':m==='part'?a+' × '+b+' / 100':a+' / '+b+' × 100';n=Number.isFinite(n)?n.toLocaleString('en-US',{maximumFractionDigits:6})+(m==='ratio'?'%':''):'The result is outside the supported range.'}$('out').textContent=n;$('formula').textContent=f||''} $('calc').onclick=calc;$('mode').onchange=calc;calc();</script></html>

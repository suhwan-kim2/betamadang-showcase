<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Code Breaker</title><style>:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#111a26;color:#edf3f8}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:700px;margin:auto}small{color:#7ed9c2;letter-spacing:2px}h1{font-size:clamp(25px,6vw,40px);margin:12px 0}p{color:#aabccb;line-height:1.65}label{display:block;margin:16px 0 8px}input,select,textarea,button{font:inherit;border-radius:12px;border:1px solid #435264;padding:13px;max-width:100%}input,select,textarea{background:#1b293a;color:inherit;width:100%}button{background:#7ed9c2;color:#102623;cursor:pointer;font-weight:700;margin:8px 6px 8px 0;min-height:46px}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #ffce79;outline-offset:3px}button:disabled{opacity:.6;cursor:default}.box{background:#1b293a;padding:20px;border-radius:18px;margin:18px 0}output{display:block;font-size:24px;color:#7ed9c2;overflow-wrap:anywhere}textarea{min-height:130px}#board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}#board button{margin:0;height:66px;font-size:24px}.history{padding-left:22px;line-height:2}.history li{border-bottom:1px solid #435264}@media(max-width:420px){body{padding:16px}.box{padding:14px}}</style><main><small>BETAMADANG / DAILY LAB</small><h1>Code Breaker</h1><p>Crack a four-digit code in ten guesses. S means the right digit in the right place; B means the right digit elsewhere.</p><label for="guess">Four different digits</label><input id="guess" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="Example: 0123"><button id="try">Guess</button><button id="restart">New code</button><div class="box"><output id="status" aria-live="polite"></output><p>Example: if the code is 0123, a guess of 0132 gives 2S 2B.</p></div><ol id="history" class="history"></ol></main><script>const $=id=>document.getElementById(id);let secret='',turn=0,over=false;function start(){let pool='0123456789'.split('');for(let i=pool.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}secret=pool.slice(0,4).join('');turn=0;over=false;$('history').replaceChildren();$('guess').value='';$('try').disabled=false;$('status').textContent='You have 10 guesses.'}function guess(){if(over)return;const v=$('guess').value;if(!/^\d{4}$/.test(v)||new Set(v).size!==4){$('status').textContent='Enter four different digits.';return}turn++;let s=0,b=0;[...v].forEach((c,i)=>{if(secret[i]===c)s++;else if(secret.includes(c))b++});const li=document.createElement('li');li.textContent=v+' → '+s+'S '+b+'B';$('history').prepend(li);over=s===4||turn===10;$('status').textContent=s===4?turn+' guesses to crack the code!':turn===10?'No guesses left. Code: '+secret:(10-turn)+' guesses left.';$('try').disabled=over;$('guess').value='';$('guess').focus()}$('try').onclick=guess;$('guess').onkeydown=e=>{if(e.key==='Enter')guess()};$('restart').onclick=start;start();</script></html>

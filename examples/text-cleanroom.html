<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Text Cleanroom</title><style>:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#111a26;color:#edf3f8}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:700px;margin:auto}small{color:#7ed9c2;letter-spacing:2px}h1{font-size:clamp(25px,6vw,40px);margin:12px 0}p{color:#aabccb;line-height:1.65}label{display:block;margin:16px 0 8px}input,select,textarea,button{font:inherit;border-radius:12px;border:1px solid #435264;padding:13px;max-width:100%}input,select,textarea{background:#1b293a;color:inherit;width:100%}button{background:#7ed9c2;color:#102623;cursor:pointer;font-weight:700;margin:8px 6px 8px 0;min-height:46px}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #ffce79;outline-offset:3px}button:disabled{opacity:.6;cursor:default}.box{background:#1b293a;padding:20px;border-radius:18px;margin:18px 0}output{display:block;font-size:24px;color:#7ed9c2;overflow-wrap:anywhere}textarea{min-height:130px}#board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}#board button{margin:0;height:66px;font-size:24px}.history{padding-left:22px;line-height:2}.history li{border-bottom:1px solid #435264}@media(max-width:420px){body{padding:16px}.box{padding:14px}}</style><main><small>BETAMADANG / DAILY LAB</small><h1>Text Cleanroom</h1><p>Remove duplicate lines, tidy extra spaces, or clear blank lines. Your original text stays untouched.</p><label for="source">Original</label><textarea id="source" placeholder="Paste a list or some text"></textarea><label for="mode">Cleanup</label><select id="mode"><option value="dedupe">Remove duplicate lines, keeping first occurrence</option><option value="space">Trim and collapse spaces on each line</option><option value="empty">Remove blank lines</option></select><button id="clean">Clean text</button><button id="reset">Clear</button><label for="result">Result</label><textarea id="result" readonly></textarea><button id="select">Select result</button><p id="status" aria-live="polite">Your text is processed here, without sending it anywhere.</p></main><script>const $=id=>document.getElementById(id);$('clean').onclick=()=>{const raw=$('source').value,lines=raw.split(/\r?\n/),mode=$('mode').value;const out=mode==='dedupe'?[...new Set(lines.map(s=>s.trim()).filter(Boolean))]:mode==='space'?lines.map(s=>s.trim().replace(/[ \t]+/g,' ')):lines.filter(s=>s.trim());$('result').value=out.join('\n');$('status').textContent=raw?'Original lines: '+lines.length+' → Result lines: '+out.length+'':'Enter some text first.'};$('select').onclick=()=>{$('result').focus();$('result').select();$('status').textContent='Selected. Use your copy menu or Ctrl/Cmd+C.'};$('reset').onclick=()=>{$('source').value='';$('result').value='';$('status').textContent='Text cleared.'};</script></html>
